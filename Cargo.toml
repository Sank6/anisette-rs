[package]
name = "anisette-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
description = "Independent Windows anisette identity and provisioning protocol components"
publish = false

[dependencies]
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
md-5 = "0.10"
plist = "1.7"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
time = { version = "0.3", features = ["formatting"] }
zeroize = "1"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "warn"
